<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій список завдань</title>
</head>
<body>
    <h1>Мій список завдань</h1>

    <input type="text" id="taskInput" placeholder="Що потрібно зробити?">
    <br>
    <label>
        <input type="checkbox" id="importantCheckbox"> Важливе завдання
    </label>
    <br>
    <button onclick="addTask()">Додати завдання</button>

    <ul id="taskList"></ul>

    <script>function addTask() {
   var input = document.getElementById("taskInput");
   var important = document.getElementById("importantCheckbox");
   var list = document.getElementById("taskList");

   if (input.value === "") {
    alert("Введіть текст завдання!");
    return;
   }

   var li = document.createElement("li");

   var done = document.createElement("input");
   done.type = "checkbox";
   done.onchange = function () {
    if (done.checked) {
     text.style.textDecoration = "line-through";
    } else {
     text.style.textDecoration = "none";
    }
   };

   var text = document.createElement("span");
   text.textContent = input.value;
   if (important.checked) {
    text.style.color = "red";
    text.style.fontWeight = "bold";
    text.textContent = "★ " + input.value;
   }

   var del = document.createElement("button");
   del.textContent = "Видалити";
   del.onclick = function () {
    li.remove();
   };

   li.appendChild(done);
   li.appendChild(text);
   li.appendChild(del);
   list.appendChild(li);

   input.value = "";
   important.checked = false;
  }</script>
</body>
</html>
